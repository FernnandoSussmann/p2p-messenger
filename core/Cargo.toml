[package]
name = "core"
description = "UI-agnostic feature slices for the p2p-messenger (identity, ...)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
zeroize.workspace = true
keyring.workspace = true
keyring-core.workspace = true
iroh-base.workspace = true
iroh.workspace = true
iroh-tickets.workspace = true
iroh-mdns-address-lookup.workspace = true
tokio-stream.workspace = true
tokio.workspace = true
tracing.workspace = true
tempfile = { workspace = true, optional = true }
protocol.workspace = true
qrcode.workspace = true
rand.workspace = true
rusqlite.workspace = true

[features]
test-support = ["dep:tempfile"]

[dev-dependencies]
tempfile.workspace = true
core = { path = ".", features = ["test-support"] }
iroh = { workspace = true, features = ["test-utils"] }
tokio = { workspace = true, features = ["net", "io-util"] }

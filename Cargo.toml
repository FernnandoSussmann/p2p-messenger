# P2P Messenger — Cargo workspace.
#
# Only crates with real content are listed as members. `core` (UI-agnostic
# feature slices) and `app` (Tauri + Svelte shell) are added here once they
# carry their first real code — see BLUEPRINT.MD.
[workspace]
resolver = "2"
members = ["protocol", "core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "GPL-3.0-only"

# Shared dependency versions, inherited by member crates via `<dep>.workspace = true`.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
tempfile = "3"
keyring = "4"
keyring-core = "1"
iroh-base = { version = "1", default-features = false, features = ["key"] }
rand = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[profile.release]
strip = true

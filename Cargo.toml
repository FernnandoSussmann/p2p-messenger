# P2P Messenger — Cargo workspace.
#
# Only crates with real content are listed as members — see BLUEPRINT.MD.
[workspace]
resolver = "2"
members = ["protocol", "core", "headless", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "GPL-3.0-only"

# Shared dependency versions, inherited by member crates via `<dep>.workspace = true`.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
tempfile = "3"
keyring = "4"
keyring-core = "1"
iroh-base = { version = "1", default-features = false, features = ["key"] }
iroh = "1"
protocol = { path = "protocol" }
iroh-tickets = "1"
iroh-mdns-address-lookup = "0.6"
tokio-stream = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry"] }
rand = "0.10"
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rusqlite = { version = "0.42", features = ["bundled-sqlcipher-vendored-openssl"] }

[profile.release]
strip = true

# Level 3 harness: TEST-ONLY throwaway nodes with unencrypted file keyrings.
# Relay scope: nodes run with --relay disabled, so this
# exercises mDNS and the ticket path over direct addresses, NOT a relay. Relay
# coverage is the Level-1 test core/tests/discovery_relay.rs.
# The bridge is deliberately NOT "internal": swarm-discovery joins the mDNS
# group via the default route, which an internal bridge lacks, so LAN discovery
# would never work there. Egress is therefore open to the host's network. Nodes
# run with n0 internet lookup disabled (headless always does), so they do no
# n0 DNS/pkarr publishing or resolution. Nothing is published to the host
# (no "ports:").
#
# More nodes: copy a service block (e.g. node-c) together with its own named
# volume. Do not use --scale: replicas would share one volume and identity.
name: p2pm-harness

x-node: &node
  build: { context: .., dockerfile: docker/headless.Dockerfile }
  image: p2pm-headless:test
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  networks: [lan]
  # No "ports:": the control socket lives inside the container only.

services:
  node-a:
    <<: *node
    volumes: ["node-a-data:/data"]
    command: [run, --data-dir, /data, --keyring, file, --name, "Node A", --relay, disabled, --lan, mdns]
  node-b:
    <<: *node
    volumes: ["node-b-data:/data"]
    command: [run, --data-dir, /data, --keyring, file, --name, "Node B", --relay, disabled, --lan, mdns]

volumes:
  node-a-data: {}
  node-b-data: {}

networks:
  lan: { driver: bridge }
